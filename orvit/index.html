<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORVIT · Control de Recorridos</title>
<meta name="description" content="Control de recorridos y revisiones · ORVIT Corporate Center · by SPEAL">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ORVIT">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;
          font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#5A5A5A;transition:opacity .4s;z-index:2}
  #splash.out{opacity:0;pointer-events:none}
  #splash img{width:84px;height:84px}
  .bar{width:120px;height:3px;background:#EFEEEC;border-radius:3px;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#B32934;border-radius:3px;animation:l 1.1s ease-in-out infinite}
  @keyframes l{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  small{font-size:11px;letter-spacing:.14em}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="ORVIT">
  <div class="bar"><i></i></div>
  <small>ORVIT · BY SPEAL</small>
</div>
<iframe id="app" title="ORVIT · Control de Recorridos" allow="camera; geolocation; clipboard-write"></iframe>
<script>
  /* ====== ÚNICO DATO A CAMBIAR: la URL /exec de la implementación de Apps Script ====== */
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwrkrHwUNGKsV_6c5_u_Ct_NOozsDdoCygRb_nyeJrQxlCcrXx970h9sGq8sUxuyULW/exec';

  const f = document.getElementById('app'), sp = document.getElementById('splash');
  f.addEventListener('load', () => setTimeout(() => sp.classList.add('out'), 250));
  setTimeout(() => sp.classList.add('out'), 8000);   // por si la red está lenta
  f.src = APPS_SCRIPT_URL;
</script>
</body>
</html>
